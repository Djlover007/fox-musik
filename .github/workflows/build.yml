name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web-Dateien vorbereiten
        run: |
          mkdir -p www && cp index.html www/index.html
          sed -i "s#__REPO__#${{ github.repository }}#" www/index.html
      - name: Signierschlüssel einrichten
        run: |
          test -f fox-debug.keystore.b64 || { echo "FEHLER: fox-debug.keystore.b64 fehlt im Repo"; exit 1; }
          mkdir -p ~/.android
          base64 -d fox-debug.keystore.b64 > ~/.android/debug.keystore
      - name: Config prüfen
        run: |
          [ -f capacitor.config.json ] || cp capacitor_config.json capacitor.config.json
          cat capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Fuchs-Icon erzeugen
        run: |
          pip install pillow
          python3 make-icons.py
      - name: Musik-Suche, Wiedergabe-Dienst und Update einbauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node setup-android.js
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fox Musik ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
