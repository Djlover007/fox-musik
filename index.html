<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}[hidden]{display:none!important}</style>
<title>Fox Musik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header, scrolling tab strip, list area, floating mini player. The full player slides over everything, sheets slide up from the bottom. */
:root{
  --bg:#f3f5f9;
  --surface:#ffffff;
  --fg:#13161d;
  --muted:#646c80;
  --line:#e1e5ee;
  --accent:#2c66f5;
  --accent-ink:#ffffff;
  --accent-soft:#e2eaff;
  --danger:#d0342c;
  --shadow:rgba(19,24,40,.14);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1016;--surface:#171b23;--fg:#eceff6;--muted:#98a0b3;--line:#262b36;
    --accent:#6c96ff;--accent-ink:#0a1128;--accent-soft:#1b2848;--danger:#ff7a70;--shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1016;--surface:#171b23;--fg:#eceff6;--muted:#98a0b3;--line:#262b36;
  --accent:#6c96ff;--accent-ink:#0a1128;--accent-soft:#1b2848;--danger:#ff7a70;--shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--fg);
  font:400 15px/1.4 var(--font-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* header */
.head{display:flex;align-items:center;gap:4px;padding-top:12px;min-height:68px;flex:none}
.head h1{margin:0;flex:1;min-width:0;font:700 32px/1.1 var(--font-display);letter-spacing:-.02em}
.nw-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin:18px 0 6px;padding:28px 18px 24px;border-radius:24px;background:linear-gradient(160deg,#1d2a5c,#3b2a6e 55%,#6b3a8a);color:#fff;box-shadow:0 14px 30px var(--shadow)}
.nw-card h2{margin:0;font:700 26px/1.1 var(--font-display);letter-spacing:-.01em}
.nw-card p{margin:0;color:rgba(255,255,255,.82);max-width:30ch}
.nw-card .btn{background:#fff;color:#2a1f5c;margin-top:8px}
.nw-logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.nw-logo svg{width:32px;height:32px}
.nw-ok{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.nw-ok svg{width:16px;height:16px;color:#ffb3d1}
.nw-help{padding:14px 4px 6px}
.nw-help b{font-weight:700}
.nw-help ol{margin:8px 0 10px;padding-left:20px;line-height:1.5}
.nw-help li{margin-bottom:6px}
.nw-help small{color:var(--muted)}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.brand small span{color:var(--accent);font-weight:700}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);color:var(--fg);transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-logo{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:#2C66F5;color:var(--accent-ink);box-shadow:0 14px 34px var(--shadow);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-logo svg{width:66px;height:66px}
#splash b{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:8px;animation:spUp .5s .15s ease both}
#splash small{font-size:14px;color:var(--muted);letter-spacing:.06em;animation:spUp .5s .3s ease both}
#splash small span{color:var(--accent);font-weight:700}
@keyframes spPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes spUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
.head h1.small{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;flex:none;padding:0}
.ib:hover,.ib[aria-pressed="true"]{background:var(--accent-soft)}
.searchrow{flex:none;padding-bottom:8px}
.searchrow input{width:100%;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 18px}
.tabs{flex:none;display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 0 12px;margin-bottom:-1px;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* list area */
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0 6px}
.cnt{flex:1;min-width:80px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.pill svg{width:18px;height:18px}
.pill.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.row{display:flex;align-items:center}
.rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:8px 0;text-align:left}
.rt{display:flex;flex-direction:column;min-width:0;flex:1}
.rt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .rt b{color:var(--accent)}
.dur{flex:none;min-width:34px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.cov{flex:none;background-size:cover;background-position:center;background-color:var(--accent-soft);display:grid;place-items:center;color:#fff}
.cov.ph{background-image:linear-gradient(135deg,hsl(var(--h) 55% 60%),hsl(calc(var(--h) + 40) 58% 44%))}
.cov svg{width:46%;height:46%;stroke-width:1.8}
.rc,.tile{width:52px;height:52px;border-radius:12px}
.tile.fav{background:var(--accent-soft);color:var(--accent)}
.tile.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;color:var(--accent)}
.eq i{display:block;width:3px;height:45%;background:currentColor;border-radius:1px}
body.playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}
.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px;padding-top:12px}
.card{background:none;border:0;padding:0;text-align:left;min-width:0}
.card .cov{width:100%;aspect-ratio:1;border-radius:18px;margin-bottom:8px}
.card b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{border-radius:50%}
.dhead{display:flex;align-items:center;gap:16px;padding:8px 0}
.dc{width:104px;height:104px;border-radius:20px}
.dtxt{min-width:0}
.dtxt h2{margin:0;font:700 24px/1.15 var(--font-display);overflow-wrap:anywhere}
.dtxt p{margin:4px 0 0;color:var(--muted)}
.none{color:var(--muted);padding:24px 0;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 8px}
.halo{width:108px;height:108px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.halo svg{width:48px;height:48px;stroke-width:1.7}
.empty h2{margin:0;font:700 24px/1.2 var(--font-display)}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.empty .hint{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-top:8px}
.btn svg{width:20px;height:20px}

/* mini player */
.mini{flex:none;position:relative;overflow:hidden;display:flex;align-items:center;gap:4px;margin:8px 0 12px;padding:8px 6px 10px 8px;background:var(--surface);border-radius:20px;box-shadow:0 2px 14px var(--shadow)}
.mini-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.mc{width:44px;height:44px;border-radius:12px}
.mt{display:flex;flex-direction:column;min-width:0}
.mt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
.mprog i{display:block;height:100%;width:0;background:var(--accent)}

/* full player */
.player{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;isolation:isolate;overflow:hidden;
  background:var(--bg);
  padding:env(safe-area-inset-top,0px) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;
}
.player.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.pbg{position:absolute;inset:-40px;z-index:-1;background-size:cover;background-position:center;filter:blur(50px) saturate(1.3);opacity:.35}
.ptop{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding-top:6px}
.ptop span{font-weight:600;color:var(--muted)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px 0}
.stage,.pinfo{touch-action:pan-y}
.big{width:min(100%,46vh,420px);aspect-ratio:1;border-radius:28px;box-shadow:0 18px 40px var(--shadow)}
.big svg{width:34%;height:34%}
.pinfo{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.pinfo .rt b{font:700 24px/1.2 var(--font-display)}
.pinfo .rt small{font-size:15px}
.fav-on{color:var(--accent)}
.seekwrap{padding-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);margin-top:-6.5px;border:0}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);border:0}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding-top:10px}
.ctrl .ib{width:52px;height:52px;color:var(--muted)}
.ctrl .ib.on{color:var(--accent)}
.ctrl .ib.skip{color:var(--fg)}
.ctrl .ib.skip svg{width:30px;height:30px}
.ctrl .main-btn{width:72px;height:72px;background:var(--accent);color:var(--accent-ink)}
.ctrl .main-btn:hover{background:var(--accent)}
.ctrl .main-btn svg{width:32px;height:32px}
.player .ctrl .main-btn{color:var(--accent-ink)}

/* sheets and toast */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .2s,visibility 0s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:82%;overflow-y:auto;
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);visibility:hidden;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;
}
.sheet.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 12px}
.shead{display:flex;align-items:center;gap:12px;padding:0 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sitem{display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:0 4px;background:none;border:0;text-align:left;font-weight:500}
.sitem svg{color:var(--muted)}
.sitem small{margin-left:auto;color:var(--muted)}
.sitem.danger,.sitem.danger svg{color:var(--danger)}
.sform{display:flex;flex-direction:column;gap:12px}
.sform h3{margin:0;font:700 20px/1.2 var(--font-display)}
.sform p{margin:0;color:var(--muted)}
.sform input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:0 16px}
.sform .btn{margin-top:0}
.sform .btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.credit{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px 0 6px;text-align:center}
.credit-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.credit-logo svg{width:24px;height:24px}
.credit b{font:700 16px/1.2 var(--font-display)}
.credit small{color:var(--muted);font-size:13px;letter-spacing:.02em}
.credit small span{color:var(--accent);font-weight:700}
.sform .btn.warn{background:var(--danger);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;max-width:calc(100% - 32px);transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:500;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
}
.set{display:flex;flex-direction:column}
.srow{padding:14px 4px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.line{display:flex;align-items:center;gap:16px;justify-content:space-between}
.srow b{display:block;font-weight:600}
.srow small{display:block;color:var(--muted)}
.srow .val{color:var(--accent);text-align:center;margin:6px 0 0;font-weight:500}
.srow button.sleepbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:0}
.srow button.sleepbtn small{color:var(--accent)}
.sw{-webkit-appearance:none;appearance:none;flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;margin:0;border:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px var(--shadow);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:21px}
.sitem.on small{color:var(--accent)}
</style>

</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></symbol>

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h14M3 12h14M3 18h8M18 15l4 3-4 3z"/></symbol>
  <symbol id="i-listplus" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h7M18 14v6M15 17h6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5-5.9-3.2-5.9 3.2 1.2-6.5L2.5 9.4l6.6-.9z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></symbol>

<script>
try{var _t=localStorage.getItem('fox-theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}

(function(){
'use strict';
var NOALBUM='Unbekanntes Album', NOARTIST='Unbekannter Interpret';
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var ic=function(n,f){return '<svg class="i'+(f?' f':'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';};

var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var shuffleArr=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
var db=null;
function openDB(){
  return new Promise(function(res,rej){
    try{
      var r=indexedDB.open('songbox',1);
      r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('songs',{keyPath:'id'});d.createObjectStore('meta');};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
}
function rq(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
async function dbPut(store,val,key){if(!db)return;try{var s=db.transaction(store,'readwrite').objectStore(store);await rq(key!==undefined?s.put(val,key):s.put(val));}catch(e){}}
async function dbDel(store,key){if(!db)return;try{await rq(db.transaction(store,'readwrite').objectStore(store).delete(key));}catch(e){}}
async function dbAll(store){if(!db)return [];try{return await rq(db.transaction(store).objectStore(store).getAll());}catch(e){return [];}}
async function dbGet(store,key){if(!db)return null;try{return await rq(db.transaction(store).objectStore(store).get(key));}catch(e){return null;}}
function dbBatch(store,items,del){
  if(!db||!items.length)return Promise.resolve();
  return new Promise(function(res){
    try{
      var t=db.transaction(store,'readwrite'), s=t.objectStore(store);
      items.forEach(function(x){if(del)s.delete(x);else s.put(x);});
      t.oncomplete=res;t.onerror=res;t.onabort=res;
    }catch(e){res();}
  });
}

/* ---------- state ---------- */
var songs=[], ready=false;
var state={playlists:[],favs:[],shuffle:false,repeat:0,hidden:[],stats:{},wish:[],spl:[],theme:'auto',autoUpd:true,speed:1,fade:0,skip:false,lock:true};
var view={tab:'tracks',detail:null}, q='', searchOpen=false;
var queue=[], origQueue=[], qi=-1, cur=null, listIds=[];
var audio=null, sleep={end:0,track:false}, actx=null;
var audioUrl='', seeking=false, sctx={};
var covUrls=new Map();
var byId=function(id){for(var i=0;i<songs.length;i++){if(songs[i].id===id)return songs[i];}return null;};
var saveState=function(){dbPut('meta',state,'state');};

/* ---------- ID3 tags ---------- */
function decText(d){
  var enc=d[0], b=d.subarray(1), label='iso-8859-1';
  if(enc===1)label=(b[0]===0xFE&&b[1]===0xFF)?'utf-16be':'utf-16le';
  else if(enc===2)label='utf-16be';
  else if(enc===3)label='utf-8';
  try{return new TextDecoder(label).decode(b).split('\0')[0].trim();}catch(e){return '';}
}
function decPic(d){
  var enc=d[0], i=1;
  while(i<d.length&&d[i]!==0)i++;
  var mime=String.fromCharCode.apply(null,Array.prototype.slice.call(d.subarray(1,i)));
  i+=2;
  if(enc===0||enc===3){while(i<d.length&&d[i]!==0)i++;i++;}
  else{while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2;}
  if(i>=d.length)return null;
  if(mime.indexOf('/')<0)mime='image/jpeg';
  return new Blob([d.slice(i)],{type:mime});
}
async function readTags(file){
  var out={};
  try{
    var h=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(h[0]!==0x49||h[1]!==0x44||h[2]!==0x33)return out;
    var ver=h[3], size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
    var buf=new Uint8Array(await file.slice(10,10+Math.min(size,8*1024*1024)).arrayBuffer());
    var p=0;
    while(p+10<=buf.length){
      var id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      var fs=ver===4?((buf[p+4]<<21)|(buf[p+5]<<14)|(buf[p+6]<<7)|buf[p+7]):(buf[p+4]*16777216+(buf[p+5]<<16)+(buf[p+6]<<8)+buf[p+7]);
      if(fs<=0||p+10+fs>buf.length)break;
      var d=buf.subarray(p+10,p+10+fs);
      if(id==='TIT2')out.title=decText(d);
      else if(id==='TPE1')out.artist=decText(d);
      else if(id==='TALB')out.album=decText(d);
      else if(id==='APIC'&&!out.cover)out.cover=decPic(d);
      p+=10+fs;
    }
  }catch(e){}
  return out;
}
function getDuration(b){
  return new Promise(function(res){
    var a=new Audio(), u=URL.createObjectURL(b), done=false;
    function fin(v){if(done)return;done=true;URL.revokeObjectURL(u);a.removeAttribute('src');res(isFinite(v)?v:0);}
    a.preload='metadata';
    a.onloadedmetadata=function(){fin(a.duration);};
    a.onerror=function(){fin(0);};
    setTimeout(function(){fin(0);},5000);
    a.src=u;
  });
}
var MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',wav:'audio/wav',flac:'audio/flac'};
async function addFiles(files){
  var list=files.filter(function(f){return /^audio\//.test(f.type)||/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac)$/i.test(f.name);});
  if(!list.length){if(files.length)toast('Das sind keine Audiodateien.');return;}
  var added=0, skipped=0;
  for(var k=0;k<list.length;k++){
    var f=list[k], key=f.name+'|'+f.size;
    if(songs.some(function(s){return s.key===key;})){skipped++;continue;}
    toast('Lese Titel '+(k+1)+' von '+list.length+' …',true);
    var tags=await readTags(f), dur=await getDuration(f);
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    var blob=f.type?f:f.slice(0,f.size,MIME[ext]||'audio/mpeg');
    var s={id:uid(),key:key,title:tags.title||f.name.replace(/\.[^.]+$/,''),artist:tags.artist||'',album:tags.album||'',duration:dur,blob:blob,cover:tags.cover||null,added:Date.now()};
    songs.push(s);added++;
    await dbPut('songs',s);
    render();
  }
  toast(added?(added+(added===1?' Titel':' Titel')+' hinzugefügt'+(skipped?' ('+skipped+' schon vorhanden)':'')):'Alle Titel sind schon in der App.');
}

/* ---------- covers ---------- */
function hue(seed){var h=0,t=String(seed||'x');for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h;}
function coverURL(s){
  if(!s||!s.cover)return '';
  var u=covUrls.get(s.id);
  if(!u){u=URL.createObjectURL(s.cover);covUrls.set(s.id,u);}
  return u;
}
function coverHTML(s,cls,seed,icon,round){
  var u=coverURL(s), r=round?' round':'';
  if(u)return '<div class="cov '+cls+r+'" style="background-image:url('+u+')"></div>';
  var h=hue(seed||(s&&(s.album||s.title)));
  return '<div class="cov ph '+cls+r+'" style="--h:'+h+'">'+ic(icon||'note')+'</div>';
}
function firstCover(arr){for(var i=0;i<arr.length;i++){if(arr[i].cover)return arr[i];}return arr[0]||null;}

/* ---------- playback ---------- */
function newAudio(){var a=new Audio();a.preload='auto';wireAudio(a);return a;}
function fadeVol(a,from,to,secs,done){
  clearInterval(a._ft);
  var t0=Date.now(), ms=Math.max(200,secs*1000);
  a.volume=from;
  a._ft=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/ms);
    try{a.volume=Math.max(0,Math.min(1,from+(to-from)*k));}catch(e){}
    if(k>=1){clearInterval(a._ft);if(done)done();}
  },100);
}
function dropAudio(a){
  try{a.pause();a.removeAttribute('src');a.load();}catch(e){}
  if(a._url){URL.revokeObjectURL(a._url);a._url='';}
}
function applySpeed(){
  try{audio.defaultPlaybackRate=state.speed;if(!audio._fast)audio.playbackRate=state.speed;}catch(e){}
}
function loadSong(s,fx){
  if(!s)return;
  cur=s;
  var old=null, secs=0;
  var st0=state.stats[s.id]||(state.stats[s.id]={n:0,last:0});st0.last=Date.now();saveStatsSoon();
  if(fx&&audio&&!audio.paused&&state.fade>0){
    old=audio;audio=newAudio();
    secs=Math.max(1,Math.min(state.fade,(old.duration||0)-old.currentTime||state.fade));
  }else{
    clearInterval(audio._ft);audio.volume=1;audio._fast=false;
    if(audio._url){URL.revokeObjectURL(audio._url);audio._url='';}
  }
  audio._counted=false;
  if(s.device){audio.src=devUrl(s);}
  else{audio._url=URL.createObjectURL(s.blob);audio.src=audio._url;}
  applySpeed();
  if(old){
    fadeVol(old,old.volume,0,secs,function(){dropAudio(old);});
    fadeVol(audio,0,1,secs);
  }
  var p=audio.play();if(p&&p.catch)p.catch(function(){});
  setMedia(s);
  pushNative(true);
  updateNow();
}
function startQueue(ids,i){
  if(!ids.length)return;
  origQueue=ids.slice();
  if(state.shuffle){queue=[ids[i]].concat(shuffleArr(ids.filter(function(_,k){return k!==i;})));qi=0;}
  else{queue=ids.slice();qi=i;}
  loadSong(byId(queue[qi]));
}
function next(auto,fx){
  if(!queue.length)return;
  if(auto&&sleep.track){sleep.track=false;audio.pause();toast('Sleep-Timer: Wiedergabe beendet');return;}
  if(auto&&state.repeat===2){audio.currentTime=0;var p=audio.play();if(p&&p.catch)p.catch(function(){});return;}
  if(qi+1<queue.length)qi++;
  else if(state.repeat===1)qi=0;
  else{if(auto){audio.pause();audio.currentTime=0;updateTransport();return;}qi=0;}
  loadSong(byId(queue[qi]),!!fx);
}
function prev(){
  if(!queue.length)return;
  if(audio.currentTime>3||qi<=0){audio.currentTime=0;return;}
  qi--;loadSong(byId(queue[qi]));
}
function togglePlay(){
  if(!cur)return;
  if(audio.paused){var p=audio.play();if(p&&p.catch)p.catch(function(){});}else audio.pause();
}
function toggleShuffle(){
  state.shuffle=!state.shuffle;
  if(queue.length&&cur){
    if(state.shuffle){queue=[cur.id].concat(shuffleArr(queue.filter(function(x){return x!==cur.id;})));qi=0;}
    else{queue=origQueue.filter(function(x){return byId(x);});qi=Math.max(0,queue.indexOf(cur.id));}
  }
  saveState();updateTransport();
}
function cycleRepeat(){state.repeat=(state.repeat+1)%3;saveState();updateTransport();toast(['Wiederholen aus','Alle wiederholen','Titel wiederholen'][state.repeat]);}
function queueNext(id){
  if(!cur){startQueue([id],0);return;}
  queue=queue.filter(function(x,i){return x!==id||i===qi;});
  qi=queue.indexOf(cur.id);
  queue.splice(qi+1,0,id);
  toast('Wird als Nächstes gespielt');
}
function setMedia(s){
  try{
    if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;
    navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:s.cover?[{src:coverURL(s),sizes:'512x512',type:s.cover.type||'image/jpeg'}]:[]});
  }catch(e){}
}
try{
  if('mediaSession' in navigator){
    var ms=navigator.mediaSession;
    ms.setActionHandler('play',function(){togglePlay();});
    ms.setActionHandler('pause',function(){togglePlay();});
    ms.setActionHandler('previoustrack',prev);
    ms.setActionHandler('nexttrack',function(){next(false);});
    ms.setActionHandler('seekto',function(d){if(d&&isFinite(d.seekTime))audio.currentTime=d.seekTime;});
  }
}catch(e){}

function hasNext(){return !sleep.track&&state.repeat!==2&&(qi+1<queue.length||state.repeat===1);}
function sleepCheck(){
  if(sleep.end&&Date.now()>=sleep.end){sleep.end=0;audio.pause();toast('Sleep-Timer: Wiedergabe beendet');}
}
function wireAudio(a){
  a.addEventListener('timeupdate',function(){
    if(a!==audio||!cur)return;
    var d=audio.duration||cur.duration||0, p=d?Math.min(100,audio.currentTime/d*100):0;
    $('#miniProg').style.width=p+'%';
    if(!seeking){
      var sk=$('#seek');sk.value=p*10;sk.style.setProperty('--p',p+'%');
      $('#tCur').textContent=fmt(audio.currentTime);
    }
    if(!audio._counted&&audio.currentTime>=Math.min(30,(audio.duration||60)/2)){
      audio._counted=true;var st1=state.stats[cur.id]||(state.stats[cur.id]={n:0,last:0});st1.n++;st1.last=Date.now();saveStatsSoon();
    }
    sleepCheck();
    if(state.fade>0&&!audio.paused&&isFinite(audio.duration)&&audio.duration>state.fade*2+2&&audio.duration-audio.currentTime<=state.fade&&hasNext()){next(true,true);}
  });
  a.addEventListener('loadedmetadata',function(){
    if(a!==audio)return;
    $('#tDur').textContent=fmt(audio.duration);
    if(cur&&isFinite(audio.duration)&&Math.abs((cur.duration||0)-audio.duration)>1){cur.duration=audio.duration;dbPut('songs',cur);}
    pushNative();
  });
  a.addEventListener('play',function(){if(a===audio){updateTransport();pushNative();if(actx&&actx.state==='suspended')actx.resume();}});
  a.addEventListener('pause',function(){if(a===audio){updateTransport();pushNative();}});
  a.addEventListener('ended',function(){if(a===audio)next(true);});
  a.addEventListener('error',function(){if(a===audio&&cur)toast('Dieser Titel lässt sich nicht abspielen.');});
  if(state.skip)silenceInit(a);
}
audio=newAudio();

/* ---------- Pausen überspringen (experimentell) ---------- */
function silenceInit(a){
  if(a._an)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var src=actx.createMediaElementSource(a), an=actx.createAnalyser();
    an.fftSize=512;src.connect(an);an.connect(actx.destination);
    a._an=an;a._buf=new Uint8Array(an.fftSize);
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
function level(a){
  if(!a._an)return -1;
  a._an.getByteTimeDomainData(a._buf);
  var m=0;for(var i=0;i<a._buf.length;i++){var v=Math.abs(a._buf[i]-128);if(v>m)m=v;}
  return m;
}
setInterval(function(){
  sleepCheck();
  if(!state.skip||!cur||audio.paused||audio._fading)return;
  var lv=level(audio);if(lv<0)return;
  var silent=lv<=2, d=audio.duration, t=audio.currentTime;
  if(t<8){
    if(silent&&!audio._fast){audio._fast=true;audio.playbackRate=8;}
    else if(!silent&&audio._fast){audio._fast=false;audio.playbackRate=state.speed;}
  }else if(audio._fast){audio._fast=false;audio.playbackRate=state.speed;}
  if(isFinite(d)&&d-t<12&&t>8){
    if(silent){audio._sil=audio._sil||Date.now();if(Date.now()-audio._sil>500&&hasNext())next(true);}
    else audio._sil=0;
  }
},150);

/* ---------- Android: Hintergrund-Wiedergabe & Sperrbildschirm ---------- */
var pb=null;
function PB(){
  if(pb)return pb;
  if(!isNative())return null;
  try{var C=window.Capacitor;pb=(C.Plugins&&C.Plugins.Playback)||C.registerPlugin('Playback');}catch(e){pb=null;}
  return pb;
}
function pushNative(newTrack){
  var P=PB();if(!P)return;
  try{
    if(!cur){P.update({stop:true}).catch(function(){});return;}
    P.update({title:cur.title,artist:cur.artist||NOARTIST,album:cur.album||'',
      duration:Math.round((audio.duration||cur.duration||0)*1000),position:Math.round(audio.currentTime*1000),
      playing:!audio.paused,speed:state.speed,lock:state.lock,newTrack:!!newTrack}).catch(function(){});
    if(newTrack){
      var s=cur;
      coverB64(s).then(function(b){if(b&&cur===s)P.setCover({data:b}).catch(function(){});});
    }
  }catch(e){}
}
async function coverB64(s){
  if(!s||!s.cover)return '';
  try{
    var bm=await createImageBitmap(s.cover), k=Math.min(1,320/Math.max(bm.width,bm.height));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.82).split(',')[1]||'';
  }catch(e){return '';}
}
function initNative(){
  var P=PB();if(!P)return;
  try{
    P.addListener('action',function(e){
      var a=e&&e.action;
      if(a==='play'){if(audio.paused)togglePlay();}
      else if(a==='pause'){audio.pause();}
      else if(a==='next')next(false);
      else if(a==='prev')prev();
      else if(a==='seek'&&isFinite(e.position)){audio.currentTime=e.position/1000;pushNative();}
    });
  }catch(x){}
}

/* ---------- UI updates ---------- */
function updateTransport(){
  var pl=!audio.paused;
  document.body.classList.toggle('playing',pl);
  var icn=ic(pl?'pause':'play',1), lbl=pl?'Pause':'Wiedergabe';

/* ---------- App-Update über GitHub ---------- */
var REPO='Djlover007/fox-musik', appVer=null, upd=null, updL=false, UP=null;
function UPDP(){
  if(UP)return UP;
  if(!isNative())return null;
  try{var C=window.Capacitor;UP=(C.Plugins&&C.Plugins.Updater)||C.registerPlugin('Updater');}catch(e){UP=null;}
  return UP;
}
async function loadVer(){
  var P=UPDP();if(!P||appVer)return;
  try{var i=await P.info();appVer={code:Number(i.versionCode),name:String(i.versionName||'')};}catch(e){}
}
function repoName(){
  if(REPO.indexOf('__')!==0)return REPO;
  try{return localStorage.getItem('fox-repo')||'';}catch(e){return '';}
}
async function checkUpdate(manual){
  var P=UPDP();if(!P)return;
  await loadVer();
  var repo=repoName();
  if(!repo){
    if(!manual)return;
    var v=window.prompt('GitHub-Repository eingeben, so wie in der Adresse auf github.com (Beispiel: meinname/fox-musik):','');
    v=v?v.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/+$/,''):'';
    if(!/^[\w.-]+\/[\w.-]+$/.test(v)){toast('Ohne Repository-Namen kann ich nicht nach Updates suchen.');return;}
    try{localStorage.setItem('fox-repo',v);}catch(e){}
    repo=v;
  }
  if(manual)toast('Suche nach Updates …');
  try{
    var ctl=new AbortController(), t=setTimeout(function(){ctl.abort();},12000);
    var r=await fetch('https://api.github.com/repos/'+repo+'/releases/latest',{signal:ctl.signal,headers:{'Accept':'application/vnd.github+json'}});
    clearTimeout(t);
    if(!r.ok)throw new Error('GitHub '+r.status);
    var j=await r.json();
    var m=String(j.tag_name||'').match(/(\d+)\s*$/), ver=m?parseInt(m[1],10):0;
    var asset=(j.assets||[]).find(function(a){return /\.apk$/i.test(a.name);});
    if(!asset)throw new Error('keine APK im Release');
    if(appVer&&ver>appVer.code){
      if(!upd||upd.ver!==ver)upd={ver:ver,url:asset.browser_download_url,size:asset.size,done:false,notes:null};
      if(!upd.notes)upd.notes=await updNotes(repo,appVer.code,ver);
      if(manual){updateSheet();}
      else if(state.autoUpd){autoGet();}
      else toast('Neue Version '+ver+' verfügbar. Einstellungen, App-Update.');
    }else if(manual)toast('Du hast die neueste Version ('+(appVer?appVer.code:'?')+').');
  }catch(e){
    if(manual)toast('Update-Prüfung fehlgeschlagen: '+String((e&&e.message)||e).slice(0,120)+' (Ist das GitHub-Repository öffentlich?)');
  }
}
var autoBusy=false, updLater=0;
function skippedVer(){return updLater;}
function cleanNotes(b){
  return String(b||'').split(/\r?\n/).map(function(l){return l.replace(/^[\s*•-]+/,'').trim();})
    .filter(function(l){return l&&!/^(co-authored-by|claude-session|signed-off-by)\b/i.test(l)&&!/^add files via upload$/i.test(l)&&!/^(update|create) [\w.-]+$/i.test(l)&&!/^https?:\/\//.test(l);});
}
async function updNotes(repo,from,to){
  try{
    var ctl=new AbortController(), t=setTimeout(function(){ctl.abort();},10000);
    var r=await fetch('https://api.github.com/repos/'+repo+'/releases?per_page=30',{signal:ctl.signal,headers:{'Accept':'application/vnd.github+json'}});
    clearTimeout(t);
    if(!r.ok)return [];
    var list=await r.json(), out=[], seen={};
    (list||[]).forEach(function(rel){
      var m=String(rel.tag_name||'').match(/(\d+)\s*$/), v=m?parseInt(m[1],10):0;
      if(v>from&&v<=to)cleanNotes(rel.body).forEach(function(l){var k=l.toLowerCase();if(!seen[k]){seen[k]=1;out.push(l);}});
    });
    return out;
  }catch(e){return [];}
}
async function autoGet(){
  var P=UPDP();if(!P||!upd||autoBusy)return;
  autoBusy=true;
  try{
    if(!upd.done){await P.download({url:upd.url});upd.done=true;}
    if(skippedVer()!==upd.ver){
      for(var w=0;w<40&&$('#sheet').classList.contains('open');w++)await new Promise(function(r){setTimeout(r,1500);});
      if(!$('#sheet').classList.contains('open'))updateSheet();
      else toast('Update '+upd.ver+' ist bereit. Einstellungen, App-Update.');
    }
  }catch(e){}
  autoBusy=false;
}
function autoCheck(){
  if(!state.autoUpd||!isNative())return;
  var t=0;try{t=Number(localStorage.getItem('fox-upd-t')||0);}catch(e){}
  if(Date.now()-t<60000)return;
  try{localStorage.setItem('fox-upd-t',String(Date.now()));}catch(e){}
  checkUpdate(false);
}
function updateSheet(){

function nt(x){return nk(x).replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+.*$/,'').trim();}

  var wa=artSet(w.a);

    var la=artSet(c[i].artist);
    if(!wa.length||!la.length||wa.some(function(a){return la.some(function(l){return l.indexOf(a)>-1||a.indexOf(l)>-1;});}))return c[i];

function parseCSV(t){

    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===dl){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&t[i+1]==='\n')i++;
      row.push(f);f='';
      if(row.length>1||row[0]!=='')rows.push(row);
      row=[];
    }else f+=c;
  }

}

    });

}

async function spPlay(bodies){
  if(!Array.isArray(bodies))bodies=[bodies];
  var body=bodies[0];
  if(spBusy)return;spBusy=true;
  try{
    if(audio&&!audio.paused)audio.pause();
    var dev=await spDevice(), opened=false;
    if(!dev){
      toast('Starte Spotify …',true);
      var P=UPDP(), target=body.context_uri||(body.uris&&body.uris[0])||'spotify:home';
      if(P)P.openUrl({url:target,fallback:'https://open.spotify.com/'}).catch(function(){});
      opened=true;
      for(var i=0;i<25&&!dev;i++){await spSleep(1200);if(i===2||i===7||i===14)await spWake();dev=await spDevice().catch(function(){return null;});}
      if(!dev){spFail('Die Spotify-App hat sich nicht als Abspielgerät gemeldet. Tippe in Spotify einmal kurz auf Play und dann hier nochmal auf den Titel.','keine Geräte in /me/player/devices');return;}
      await spSleep(800);
    }
    if(!dev.is_active){
      toast('Wecke Spotify …',true);
      if(await spWake()){var act=await spWaitActive(6000);if(act)dev=act;}
    }
    var err=await spTryPlay(dev,body);
    if(err&&(err.status>=500||err.status===404)){
      if(await spWake()){var act2=await spWaitActive(6000);if(act2)dev=act2;await spSleep(400);err=await spTryPlay(dev,body);}
    }
    for(var k=1;err&&err.status!==403&&k<bodies.length;k++){await spSleep(600);err=await spTryPlay(dev,bodies[k]);}
    if(err&&!opened){
      var ds=await spDevices().catch(function(){return [];}), other=ds.find(function(x){return x.id!==dev.id&&x.type==='Smartphone';});
      if(other)err=await spTryPlay(other,body);
    }
    if(err){
      var m=spMsg(err);
      if(err.status===403)spFail(/premium/i.test(m)?'Spotify erlaubt die Steuerung nur mit Premium.':'Spotify hat das Abspielen abgelehnt. Ist dein Konto Premium und in deiner Spotify-Entwickler-App freigeschaltet?',m);
      else if(err.status===404)spFail('Spotify findet kein aktives Gerät. Öffne Spotify, tippe kurz auf Play und versuche es dann nochmal.',m);
      else if(err.status>=500)spFail('Spotify hatte einen internen Fehler. Öffne die Spotify-App, tippe dort kurz auf Play und dann hier nochmal auf den Titel. Das „weckt“ Spotify meist auf.',m+' ('+err.status+')');
      else spFail('Spotify konnte nicht starten.',m+' ('+err.status+')');
      return;
    }
    try{clearTimeout(tt);}catch(e){}
    toast('Spielt in Spotify.');
    setTimeout(spNowTick,1200);
  }catch(e){
    spFail(e&&e.status===403?'Spotify erlaubt die Steuerung nur mit Premium.':'Spotify konnte nicht starten.',spMsg(e));
  }finally{spBusy=false;}
}

async function exportBackup(){

async function applyBackup(text){
  var d;try{d=JSON.parse(text);}catch(e){toast('Das ist keine gültige Sicherungsdatei.');return;}
  if(!d||d.app!=='fox-musik'){toast('Das ist keine Fox-Musik-Sicherung.');return;}
  toast('Lese Sicherung …');
  if(isNative()){
    var t0=Date.now();await scanDevice(false);
    while(scanning&&Date.now()-t0<20000)await new Promise(function(r){setTimeout(r,200);});
  }
  var info=d.songs||{}, miss=0, cache={};
  function mapId(id){
    if(Object.prototype.hasOwnProperty.call(cache,id))return cache[id];
    var r=null, inf=info[id], s=byId(id);
    if(s&&(!inf||nk(s.title)===nk(inf.t)))r=s.id;
    else if(inf){
      var c=songs.filter(function(x){return nk(x.title)===nk(inf.t)&&nk(x.artist)===nk(inf.a);});
      if(c.length>1){var c2=c.filter(function(x){return Math.abs((x.duration||0)-(inf.d||0))<=3;});if(c2.length)c=c2;}
      if(c.length)r=c[0].id;
    }
    cache[id]=r;if(!r)miss++;return r;
  }
  var nf=0, np=0;
  (d.favs||[]).forEach(function(id){var m=mapId(id);if(m&&state.favs.indexOf(m)<0){state.favs.push(m);nf++;}});
  (d.playlists||[]).forEach(function(p){
    var ids=(p.ids||[]).map(mapId).filter(Boolean);
    var ex=state.playlists.filter(function(q){return nk(q.name)===nk(p.name);})[0];
    if(ex){ids.forEach(function(i){if(ex.ids.indexOf(i)<0)ex.ids.push(i);});}
    else{
      var q=Object.assign({},p);q.ids=ids;
      if(state.playlists.some(function(z){return z.id===q.id;}))q.id=uid();
      state.playlists.push(q);np++;
    }
  });
  var st=d.stats||{};
  Object.keys(st).forEach(function(id){
    var m=mapId(id);if(!m)return;
    var o=state.stats[m]||(state.stats[m]={n:0,last:0});
    o.n=Math.max(o.n||0,st[id].n||0);o.last=Math.max(o.last||0,st[id].last||0);
  });
  (d.spl||[]).forEach(function(p){if(p&&p.id&&!state.spl.some(function(x){return x.id===p.id;}))state.spl.push(p);});
  var se=d.settings||{};
  if(se.speed)state.speed=se.speed;
  if(typeof se.fade==='number')state.fade=se.fade;
  if(typeof se.skip==='boolean'){state.skip=se.skip;if(se.skip)silenceInit(audio);}
  if(typeof se.lock==='boolean')state.lock=se.lock;
  if(typeof se.autoUpd==='boolean')state.autoUpd=se.autoUpd;
  if(typeof se.shuffle==='boolean')state.shuffle=se.shuffle;
  if(typeof se.repeat==='number')state.repeat=se.repeat;
  applySpeed();saveState();closeSheet();render();updateTransport();
  toast('Sicherung geladen: '+nf+' Favoriten, '+np+' Playlists'+(miss?' ('+miss+' Titel nicht gefunden)':''));
}

  h+='<button class="sitem" data-sa="settings"><span>Zurück</span></button>';
  openSheet(h);
}
function onSetting(e){
  var el=e.target.closest&&e.target.closest('[data-set]');if(!el)return;
  var k=el.dataset.set;
  if(k==='speed'){
    state.speed=parseInt(el.value,10)/100;el.style.setProperty('--p',pct(el.value,50,200));
    $('#vSpeed').textContent=fmtSpeed();applySpeed();
  }else if(k==='fade'){
    state.fade=parseInt(el.value,10);el.style.setProperty('--p',pct(el.value,0,12));
    $('#vFade').textContent=fmtFade();
  }else if(k==='skip'){
    state.skip=el.checked;
    if(state.skip){silenceInit(audio);}else{audio._fast=false;audio.playbackRate=state.speed;}
    if(state.skip&&!audio._an)toast('Wirkt ab dem nächsten Titel.');
  }else if(k==='lock'){state.lock=el.checked;}
  else if(k==='dark'){state.theme=el.checked?'dark':'light';applyTheme();}
  else if(k==='autoupd'){state.autoUpd=el.checked;if(state.autoUpd)autoCheck();}
  if(e.type==='change'||k==='skip'||k==='lock'||k==='autoupd'||k==='dark'){saveState();pushNative();}
}
function createPlaylist(){
  var inp=$('#plname'), name=(inp&&inp.value||'').trim();
  if(!name){toast('Gib der Playlist einen Namen.');return;}
  var p={id:uid(),name:name,ids:[]};
  if(sctx.id)p.ids.push(sctx.id);
  state.playlists.push(p);saveState();closeSheet();render();
  toast(sctx.id?'Playlist „'+name+'“ erstellt und Titel hinzugefügt':'Playlist „'+name+'“ erstellt');
}
async function deleteSong(id){
  var s0=byId(id);
  if(s0&&s0.device&&state.hidden.indexOf(s0.key)<0)state.hidden.push(s0.key);
  var wasCur=cur&&cur.id===id;
  songs=songs.filter(function(s){return s.id!==id;});
  state.favs=state.favs.filter(function(x){return x!==id;});delete state.stats[id];
  state.playlists.forEach(function(p){p.ids=p.ids.filter(function(x){return x!==id;});});
  origQueue=origQueue.filter(function(x){return x!==id;});
  if(wasCur){audio.pause();cur=null;queue=[];origQueue=[];qi=-1;closePlayer();}
  else{queue=queue.filter(function(x){return x!==id;});qi=cur?queue.indexOf(cur.id):-1;}
  var u=covUrls.get(id);if(u){URL.revokeObjectURL(u);covUrls.delete(id);}
  await dbDel('songs',id);saveState();
  pushNative();closeSheet();updateNow();render();toast('Titel gelöscht');
}
function handleSheet(act,el){
  switch(act){
    case 'cancel':closeSheet();break;
    case 'settings':settingsSheet();break;
    case 'upd':checkUpdate(true);break;
    case 'updgo':doUpdate();break;
    case 'spot':{var ss=byId(sctx.id);closeSheet();if(ss)spotSearch((ss.artist||'')+' '+ss.title);break;}
    case 'themeauto':state.theme='auto';applyTheme();saveState();settingsSheet();break;
    case 'bkexport':exportBackup();break;
    case 'bkimport':importBackup();break;
    case 'updlater':updLater=upd?upd.ver:0;closeSheet();break;
    case 'sleepmenu':sleepSheet();break;
    case 'sleepset':{
      var v=el.dataset.v;sleep.track=false;sleep.end=0;
      if(v==='track'){sleep.track=true;toast('Die Wiedergabe endet nach diesem Titel');}
      else if(v!=='0'){sleep.end=Date.now()+parseInt(v,10)*60000;toast('Sleep-Timer: '+v+' Minuten');}
      else toast('Sleep-Timer aus');
      settingsSheet();break;
    }
    case 'next':queueNext(sctx.id);closeSheet();break;
    case 'addpl':addPlSheet();break;
    case 'fav':toggleFav(sctx.id);closeSheet();break;
    case 'rmpl':{var p=state.playlists.find(function(x){return x.id===view.detail.key;});if(p){p.ids=p.ids.filter(function(x){return x!==sctx.id;});saveState();}closeSheet();render();toast('Aus Playlist entfernt');break;}
    case 'del':{var s=byId(sctx.id);confirmSheet('Titel löschen?','„'+esc(s?s.title:'')+'“ wird aus der App entfernt. Die Datei auf deinem Handy bleibt erhalten.','delyes','Löschen');break;}
    case 'delyes':deleteSong(sctx.id);break;
    case 'newpl':newPlSheet();break;
    case 'create':createPlaylist();break;
    case 'spcidsave':spCidSave();break;
    case 'spdash':{var Pd=UPDP();if(Pd)Pd.openUrl({url:'https://developer.spotify.com/dashboard'}).catch(function(){toast('Öffne developer.spotify.com/dashboard im Browser.');});else window.open('https://developer.spotify.com/dashboard','_blank');break;}
    case 'spcopyredir':try{navigator.clipboard.writeText(SP_REDIR).then(function(){toast('Kopiert: '+SP_REDIR);},function(){toast('Bitte abtippen: '+SP_REDIR);});}catch(e){toast('Bitte abtippen: '+SP_REDIR);}break;
    case 'pick':{
      var pl=state.playlists.find(function(x){return x.id===el.dataset.pl;});
      if(pl){if(pl.ids.indexOf(sctx.id)>-1)toast('Der Titel ist schon in „'+pl.name+'“.');else{pl.ids.push(sctx.id);saveState();toast('Zu „'+pl.name+'“ hinzugefügt');}}
      closeSheet();render();break;
    }
    case 'delpl':confirmSheet('Playlist löschen?','Die Titel selbst bleiben in der App.','delplyes','Playlist löschen');break;
    case 'delplyes':
      state.playlists=state.playlists.filter(function(x){return x.id!==view.detail.key;});
      saveState();closeSheet();view.detail=null;render();toast('Playlist gelöscht');break;
  }
}

});
$('#files').addEventListener('change',function(e){var f=Array.prototype.slice.call(e.target.files);e.target.value='';addFiles(f);});
$('#q').addEventListener('input',function(e){q=e.target.value.trim();renderMain();});
var seek=$('#seek');
seek.addEventListener('input',function(){
  seeking=true;
  var d=audio.duration||(cur&&cur.duration)||0, p=seek.value/10;
  seek.style.setProperty('--p',p+'%');

});

  if(d)audio.currentTime=d*seek.value/1000;

/* ---------- Wischen im Player: links = nächster Titel, rechts = vorheriger ---------- */
(function(){
  var pl=$('#player'), st=$('#pCovWrap'), x0=0, y0=0, dx=0, on=false, lock=false, busy=false;
  function reset(ms){st.style.transition=ms?'transform '+ms+'ms ease, opacity '+ms+'ms ease':'none';st.style.transform='';st.style.opacity='';}
  pl.addEventListener('touchstart',function(e){
    on=false;lock=false;dx=0;
    if(busy||!cur||e.touches.length!==1)return;
    if(e.target.closest('input,.ctrl,.ptop,.seekwrap,button'))return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;on=true;
  },{passive:true});
  pl.addEventListener('touchmove',function(e){
    if(!on)return;
    var t=e.touches[0], mx=t.clientX-x0, my=t.clientY-y0;
    if(!lock){
      if(Math.abs(my)>12&&Math.abs(my)>Math.abs(mx)){on=false;return;}
      if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my))lock=true;else return;
    }
    dx=mx;
    if(e.cancelable)e.preventDefault();
    st.style.transition='none';
    st.style.transform='translateX('+(dx*0.6)+'px)';
    st.style.opacity=String(1-Math.min(0.5,Math.abs(dx)/500));
  },{passive:false});
  function end(){
    if(!on||!lock){on=false;return;}
    on=false;lock=false;
    var go=Math.abs(dx)>70&&queue.length>1;
    if(!go){reset(180);return;}
    var left=dx<0;busy=true;
    st.style.transition='transform .14s ease, opacity .14s ease';
    st.style.transform='translateX('+(left?-80:80)+'px)';st.style.opacity='0';
    setTimeout(function(){
      if(left){next(false);}
      else if(qi>0){qi--;loadSong(byId(queue[qi]));}
      else{audio.currentTime=0;}
      reset(0);
      st.style.transform='translateX('+(left?60:-60)+'px)';st.style.opacity='0';
      void st.offsetWidth;
      st.style.transition='transform .22s ease, opacity .22s ease';
      st.style.transform='';st.style.opacity='';
      setTimeout(function(){busy=false;},230);
    },140);
  }
  pl.addEventListener('touchend',end,{passive:true});
  pl.addEventListener('touchcancel',function(){if(on&&lock)reset(180);on=false;lock=false;},{passive:true});
})();

/* ---------- automatic scan (Android app only) ---------- */
var scanning=false, lastScan=0, coverBusy=false, mediaScan=null;
function isNative(){try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());}catch(e){return false;}}
function getScanPlugin(){
  if(mediaScan)return mediaScan;
  var C=window.Capacitor;if(!C)return null;
  try{mediaScan=(C.Plugins&&C.Plugins.MediaScan)||(typeof C.registerPlugin==='function'&&C.registerPlugin('MediaScan'))||null;}catch(e){}
  if(!mediaScan&&typeof C.nativePromise==='function'){
    mediaScan={
      scan:function(){return C.nativePromise('MediaScan','scan',{});},
      requestAccess:function(){return C.nativePromise('MediaScan','requestAccess',{});}
    };
  }
  return mediaScan;
}
function devUrl(s){return window.Capacitor.convertFileSrc('file://'+s.path.split('/').map(encodeURIComponent).join('/'));}
async function scanDevice(manual){
  var P=getScanPlugin();
  if(!P){if(manual)toast('Such-Modul fehlt. Capacitor: '+Object.keys(window.Capacitor||{}).join(', ').slice(0,160));return;}
  if(scanning){if(manual)toast('Die Suche läuft schon …');return;}
  scanning=true;renderMain();
  if(manual)toast('Suche Musik auf dem Handy …',true);
  try{
    var r=await Promise.race([P.scan(),new Promise(function(_,rej){setTimeout(function(){rej(new Error('Zeitüberschreitung'));},20000);})]);
    var found=(r&&r.songs)||[];
    var have=new Map();songs.forEach(function(s){if(s.device)have.set(s.key,s);});
    var hidden=new Set(state.hidden), seen=new Set(), fresh=[], added=[];
    found.forEach(function(x){
      var key='dev|'+x.id;
      if(hidden.has(key))return;
      seen.add(key);
      if(have.has(key)){var o=have.get(key),ch=false;if(o.path!==x.path){o.path=x.path;ch=true;}if(x.added&&o.added!==x.added){o.added=x.added;ch=true;}if(ch)fresh.push(o);return;}
      var n={id:'d'+x.id,key:key,device:true,title:x.title||String(x.path).split('/').pop().replace(/\.[^.]+$/,''),artist:x.artist||'',album:x.album||'',duration:x.duration||0,path:x.path,cover:null,added:x.added||Date.now()};
      fresh.push(n);added.push(n);
    });
    var goneSongs=songs.filter(function(s){return s.device&&!seen.has(s.key);});
    var goneIds=goneSongs.map(function(s){return s.id;});
    added.forEach(function(s){songs.push(s);});
    if(goneIds.length){
      var gs=new Set(goneIds);
      songs=songs.filter(function(s){return !gs.has(s.id);});
      state.favs=state.favs.filter(function(x){return !gs.has(x);});goneIds.forEach(function(g){delete state.stats[g];});
      state.playlists.forEach(function(p){p.ids=p.ids.filter(function(x){return !gs.has(x);});});
      queue=queue.filter(function(x){return !gs.has(x);});
      qi=cur?queue.indexOf(cur.id):-1;
      await dbBatch('songs',goneIds,true);
      saveState();
    }
    await dbBatch('songs',fresh,false);
    if(added.length)toast(added.length+(added.length===1?' neuer Titel':' neue Titel')+' gefunden');
    else if(manual)toast('Keine neuen Titel gefunden.');
  }catch(e){
    var m=String((e&&e.message)||e);
    if(/permission/i.test(m)){
      if(manual){
        try{await P.requestAccess();}catch(x){}
        toast('Erlaube Fox Musik den Zugriff auf „Musik und Audio“. Kommt kein Fenster, öffne die Android-Einstellungen, Apps, Fox Musik, Berechtigungen.');
      }
    }else{
      toast('Fehler bei der Suche: '+m.slice(0,200)+(/not implemented|unavailable|unable/i.test(m)?' (Android-Teil der App fehlt: neu bauen)':''));
    }
  }
  scanning=false;lastScan=Date.now();
  render();coverJob();
}
async function fetchHead(url,n){
  var ctl=new AbortController();
  var res=await fetch(url,{headers:{Range:'bytes=0-'+(n-1)},signal:ctl.signal});
  var rd=res.body.getReader(), parts=[], got=0;
  while(got<n){var r=await rd.read();if(r.done)break;parts.push(r.value);got+=r.value.length;}
  try{rd.cancel();}catch(e){}
  try{ctl.abort();}catch(e){}
  return new Blob(parts).slice(0,n);
}
async function deviceCover(s){
  try{
    var url=devUrl(s);
    var u=new Uint8Array(await (await fetchHead(url,10)).arrayBuffer());
    if(u[0]!==0x49||u[1]!==0x44||u[2]!==0x33)return null;
    var size=((u[6]<<21)|(u[7]<<14)|(u[8]<<7)|u[9])+10;
    var t=await readTags(await fetchHead(url,Math.min(size,6*1024*1024)));
    return t.cover||null;
  }catch(e){return null;}
}
async function coverJob(){
  if(coverBusy)return;
  coverBusy=true;
  try{
    var cache=new Map();
    var todo=songs.filter(function(s){return s.device&&!s.cover&&!s.coverTried;});
    for(var i=0;i<todo.length;i++){
      var s=todo[i], ak=s.album?(s.album+'|'+s.artist):'', blob;
      if(ak&&cache.has(ak))blob=cache.get(ak);
      else{blob=await deviceCover(s);if(ak)cache.set(ak,blob);}
      s.coverTried=true;
      if(blob)s.cover=blob;
      await dbPut('songs',s);
      if(i%15===14)renderMain();
    }
  }catch(e){}
  coverBusy=false;
  render();if(cur)updateNow();
}
window.addEventListener('fox-permission',function(){scanDevice(false);});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&isNative()&&ready&&Date.now()-lastScan>60000)scanDevice(false);

  if(document.visibilityState==='visible'&&isNative()&&ready)autoCheck();
  if(document.visibilityState==='visible'&&isNative()&&view.tab==='neowake')nwStatus();
});

/* ---------- start ---------- */
document.querySelectorAll('[data-ic]').forEach(function(el){el.innerHTML=ic(el.dataset.ic,el.dataset.f);});
updateTransport();
render();
(async function(){
  try{
    db=await openDB();
    songs=await dbAll('songs');
    var saved=await dbGet('meta','state');
    if(saved){
      state.playlists=saved.playlists||[];state.favs=saved.favs||[];
      state.shuffle=!!saved.shuffle;state.repeat=saved.repeat||0;state.hidden=saved.hidden||[];
      state.stats=saved.stats||{};state.autoUpd=saved.autoUpd!==false;state.wish=saved.wish||[];state.spl=saved.spl||[];state.theme=saved.theme||'auto';state.speed=saved.speed||1;state.fade=saved.fade||0;state.skip=!!saved.skip;state.lock=saved.lock!==false;
    }
  }catch(e){db=null;toast('Speichern ist hier nicht möglich. Titel bleiben nur bis zum Schließen erhalten.');}
  ready=true;
  updateTransport();
  render();
  setTimeout(function(){var sp=$('#splash');if(sp){sp.classList.add('hide');setTimeout(function(){sp.remove();},600);}},1300);
  applyTheme();applySpeed();if(state.skip)silenceInit(audio);
  if(isNative()){initNative();scanDevice(false);setTimeout(autoCheck,2500);}
})();
})();
